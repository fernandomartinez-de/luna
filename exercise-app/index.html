<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070d1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lyftr" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Lyftr</title>
    <script>
      // Restore the URL the visitor originally asked for. The root
      // /personal/404.html stashes the intended path in sessionStorage
      // and redirects here; we replace history so react-router sees
      // the real route on load.
      (function () {
        try {
          var target = sessionStorage.getItem('lyftr:redirect');
          if (target) {
            sessionStorage.removeItem('lyftr:redirect');
            if (target !== window.location.pathname + window.location.search + window.location.hash) {
              window.history.replaceState(null, '', target);
            }
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
