<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>(function(){try{var m=window.matchMedia;var mob=(m&&(m('(max-width:700px)').matches||m('(display-mode: standalone)').matches||m('(pointer: coarse)').matches))||navigator.standalone===true;if(mob)document.documentElement.setAttribute('data-mobile','');}catch(_){}})();</script>
<title>Overload · Cut to Abs</title>
<link rel="manifest" href="../../manifest.json">
<meta name="theme-color" content="#0c0d11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Overload">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap">
<style>
html{color-scheme:light dark}
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --surface-2:#F3F5F8; --raise:#FFFFFF;
  --ink:#14171C; --muted:#5B6371; --faint:#8B93A1; --line:#E4E7EC;
  --accent:#E4551C; --on-accent:#FFFFFF; --accent-soft:#FCEBE2;
  --good:#12905A; --good-soft:#E2F3EA; --good-ink:#0C6B43;
  --shadow:0 1px 2px rgba(20,23,28,.06), 0 6px 20px rgba(20,23,28,.06);
  --shadow-sm:0 1px 2px rgba(20,23,28,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0F14; --surface:#161920; --surface-2:#1D212A; --raise:#20242E;
    --ink:#ECEEF3; --muted:#98A0AF; --faint:#69707F; --line:#262B35;
    --accent:#FF6B3D; --on-accent:#1A0D07; --accent-soft:#2A1912;
    --good:#39C880; --good-soft:#132420; --good-ink:#4BD98F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.34);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0D0F14; --surface:#161920; --surface-2:#1D212A; --raise:#20242E;
  --ink:#ECEEF3; --muted:#98A0AF; --faint:#69707F; --line:#262B35;
  --accent:#FF6B3D; --on-accent:#1A0D07; --accent-soft:#2A1912;
  --good:#39C880; --good-soft:#132420; --good-ink:#4BD98F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.34);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit;color:inherit;cursor:pointer}
.tnum{font-variant-numeric:tabular-nums}
.cond{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}

.shell{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
.scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:0}
.wrap{padding:0 16px 28px}

.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--line);padding:11px 16px 10px}
.hdr-row{display:flex;align-items:center;gap:10px}
.dom{display:flex;gap:6px;margin-top:10px}
.dom button{flex:1;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:13.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;transition:background .12s ease,color .12s ease}
.dom button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.mark{font-family:"Barlow Condensed",sans-serif;font-weight:800;letter-spacing:.02em;font-size:23px;line-height:1;text-transform:uppercase;color:var(--ink)}
.mark b{color:var(--accent)}
.brand .tag{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);font-weight:600;white-space:nowrap}
.hdr .sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);box-shadow:var(--shadow-sm)}
.iconbtn svg{width:19px;height:19px}

.sec-title{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:22px 2px 8px}

/* plan */
.goal{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);padding:16px 16px 14px;position:relative;overflow:hidden}
.goal:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.goal .verb{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:30px;line-height:1;text-transform:uppercase;letter-spacing:.005em;color:var(--accent)}
.goal .sub{font-size:13.5px;color:var(--ink);margin-top:8px;line-height:1.5}
.goal .sub b{font-weight:700}
.goal .load{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.pill.warm{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,var(--line));background:var(--accent-soft)}
.pill.ok{color:var(--good-ink);border-color:color-mix(in srgb,var(--good) 30%,var(--line));background:var(--good-soft)}

.timeline{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);padding:14px}
.tlhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tlhead b{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.tlhead span{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.tlbar{position:relative;height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;margin-top:10px}
.tlbar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:5px}
.tlmeta{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--muted);font-weight:600}

.trend{display:flex;gap:10px;margin-top:12px}
.trend .tc{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow-sm)}
.trend .tc.hi{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.trend .tlab{font-size:10.5px;color:var(--faint);font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.trend .tval{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:28px;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums}
.trend .tval em{font-style:normal;font-size:13px;color:var(--muted);font-weight:600;margin-left:4px}
.trend .tdelta{font-size:12px;font-weight:700;margin-top:4px}
.trend .tdelta.down{color:var(--good-ink)}
.trend .tdelta.up{color:var(--accent)}
.trend .tdelta.flat{color:var(--faint)}
.trend .spark{display:flex;align-items:flex-end;gap:2px;height:26px;margin-top:8px}
.trend .spark i{flex:1;background:var(--accent);border-radius:2px;opacity:.85;min-height:2px}
.trend .tc.body .spark i{background:var(--muted)}

/* session focus */
.filter{display:flex;gap:8px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none;margin:0 -2px}
.filter::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;box-shadow:var(--shadow-sm);font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:14px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.chip[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* weekly calendar */
.wkcal{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;box-shadow:var(--shadow-sm)}
.wkcalh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.wkcalh b{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.wkcalh span{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.wkgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wkday{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:6px 4px 5px;text-align:center;cursor:pointer;min-height:56px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;position:relative;overflow:hidden}
.wkday.today{border-color:var(--accent)}
.wkday.done{background:color-mix(in srgb,var(--good) 15%,var(--surface));border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.wkday.missed{background:color-mix(in srgb,var(--lo) 12%,var(--surface));border-color:color-mix(in srgb,var(--lo) 40%,var(--line))}
.wkday .dow{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.wkday.today .dow{color:var(--accent)}
.wkday .lbl{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:10.5px;line-height:1.05;text-transform:uppercase;color:var(--ink);text-align:center;letter-spacing:.02em}
.wkday.done .lbl{color:var(--good-ink)}
.wkday.missed .lbl{color:var(--lo)}
.wkday .mark{position:absolute;top:2px;right:4px;font-size:11px;color:var(--good-ink);font-weight:700}
.wkday.missed .mark{color:var(--lo)}
.wksum{margin-top:10px;font-size:12px;color:var(--muted)}
.wksum b{color:var(--ink);font-weight:700}
.wksum .warn{color:var(--lo);font-weight:700}
.suggest{margin-top:10px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:10px;padding:8px 10px;font-size:13px;color:var(--ink)}
.suggest b{font-family:"Barlow Condensed",sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.02em;color:var(--accent);font-size:13.5px}
.suggest.behind{background:color-mix(in srgb,var(--lo) 12%,var(--surface));border-color:color-mix(in srgb,var(--lo) 40%,var(--line))}
.suggest.behind b{color:var(--lo)}

/* exercise image strip */
.imgstrip{display:flex;gap:8px;margin-top:10px}
.imgstrip figure{flex:1;margin:0;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;overflow:hidden;display:flex;flex-direction:column}
.imgstrip img{width:100%;height:100px;object-fit:contain;background:#fff;display:block}
.imgstrip figcaption{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);text-align:center;padding:4px 0 5px;background:var(--surface-2)}

.dayhead{padding:8px 0 4px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.dayhead h1{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:30px;line-height:.98;margin:0;text-transform:uppercase;letter-spacing:.005em}
.dayhead .meta{color:var(--muted);font-size:13px;font-weight:500;margin-top:3px}
.dayhead .vol{text-align:right;line-height:1}
.dayhead .vol b{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:22px;color:var(--accent)}
.dayhead .vol span{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-top:3px}

.rowlab{display:inline-block;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:3px 8px;margin:12px 0 4px}
.rowlab.acc{color:var(--muted);background:var(--surface-2);border:1px solid var(--line)}

.excard{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:10px;box-shadow:var(--shadow-sm);padding:12px 14px}
.exname{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:19px;line-height:1.1;text-transform:uppercase;letter-spacing:.01em}
.exname .rank{color:var(--faint);font-size:14px;margin-right:6px}
.exmech{color:var(--muted);font-size:12.5px;margin-top:6px;line-height:1.4}
.excue{color:var(--faint);font-size:12px;margin-top:5px;font-style:italic}
.exspec{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.spec{background:var(--surface-2);border-radius:8px;padding:6px 10px;font-size:12.5px;color:var(--ink);font-weight:600}
.spec span{color:var(--faint);font-weight:500;margin-right:3px}
.exhist{margin-top:8px;font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:7px 10px}
.exhist b{color:var(--ink);font-weight:700}
.excite{font-size:11px;color:var(--faint);margin-top:8px}
.excite a{color:var(--muted);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}

.copyblk{margin-top:16px;background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 14px 10px;box-shadow:var(--shadow-sm)}
.copyblk .ct{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.copyblk .ct b{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.copyblk button{background:var(--accent);color:var(--on-accent);border:0;border-radius:9px;padding:7px 12px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.copyblk pre{margin:0;font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;font-size:12.5px;line-height:1.55;white-space:pre-wrap;color:color-mix(in srgb,var(--bg) 92%,var(--accent))}

.note{margin-top:12px;background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--muted);line-height:1.5}
.note b{color:var(--ink)}

/* block table */
.blocktbl{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm)}
.blocktbl table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.blocktbl th,.blocktbl td{padding:8px 8px;text-align:left;font-size:12px;border-bottom:1px solid var(--line)}
.blocktbl thead th{background:var(--surface-2);font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.blocktbl tr.now td{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.blocktbl tr.now td:first-child{position:relative}
.blocktbl tr.now td:first-child:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.blocktbl td.wk{font-family:"Barlow Condensed",sans-serif;font-weight:800;color:var(--ink);text-align:center;width:36px}
.blocktbl td.ph{font-weight:600;color:var(--ink);white-space:nowrap}
.blocktbl td.ph.deload{color:var(--faint)}
.blocktbl td.ph.sharpen{color:var(--accent)}
.blocktbl td.pri,.blocktbl td.acc{color:var(--muted);font-size:11.5px}
.blocktbl .blocktag{display:inline-block;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:12px}
.blocktbl caption{caption-side:top;text-align:left;padding:12px 12px 4px;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}

/* method */
.msec{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;box-shadow:var(--shadow-sm)}
.msec h3{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 6px;color:var(--ink)}
.msec .est{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-radius:4px;padding:2px 7px;margin-left:6px;vertical-align:2px}
.msec .est.established{background:var(--good-soft);color:var(--good-ink)}
.msec .est.emerging{background:var(--accent-soft);color:var(--accent)}
.msec p{font-size:13.5px;line-height:1.55;color:var(--ink);margin:6px 0}
.msec ul{margin:6px 0;padding-left:20px;font-size:13.5px;line-height:1.55}
.msec li{margin:3px 0}
.msec .ref{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}
.msec .ref b{color:var(--ink);font-weight:600}
.msec .ref a{color:var(--muted);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}

.disc{font-size:11.5px;color:var(--faint);text-align:center;padding:16px 8px 4px;line-height:1.5}

/* nav */
.nav{flex:0 0 auto;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;background:none;border:0;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint)}
.nav button svg{width:22px;height:22px}
.nav button span{font-size:10px;font-weight:600;letter-spacing:.03em}
.nav button[aria-selected="true"]{color:var(--accent)}

.toast{position:absolute;left:50%;bottom:78px;transform:translate(-50%,20px);z-index:50;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:var(--shadow);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast b{color:var(--accent)}

/* --- Nutrition domain --- */
.iohero{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);padding:16px 16px 14px;position:relative;overflow:hidden}
.iohero:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.iohero .ihd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.iohero .verb{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:26px;line-height:1;text-transform:uppercase;letter-spacing:.005em;color:var(--accent)}
.iohero .whn{font-size:10.5px;color:var(--faint);font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.iohero .iogrid{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-top:8px}
.iohero .iocell{display:flex;flex-direction:column;gap:2px;min-width:0}
.iohero .iocell.right{align-items:flex-end;text-align:right}
.iohero .iolab{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.iohero .ioval{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.iohero .ioval em{font-style:normal;font-size:12px;color:var(--muted);font-weight:600;margin-left:4px}
.iohero .iosep{font-family:"Barlow Condensed",sans-serif;font-size:20px;color:var(--faint);font-weight:800}
.iohero .iobadge{margin-top:12px;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line)}
.iohero .iobadge.deficit{color:var(--good-ink);background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 30%,var(--line))}
.iohero .iobadge.surplus{color:var(--accent);background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.iohero .iobadge.flat{color:var(--muted);background:var(--surface-2)}
.iohero .iobadge .num{font-variant-numeric:tabular-nums}

.macros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.macro{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 12px;box-shadow:var(--shadow-sm)}
.macro .mlab{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.macro .mval{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:22px;line-height:1;font-variant-numeric:tabular-nums;margin-top:3px;color:var(--ink)}
.macro .mval em{font-style:normal;font-size:11px;color:var(--muted);font-weight:600;margin-left:2px}
.macro .mpct{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:3px}
.macro .mbar{margin-top:8px;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.macro .mbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.macro .mtgt{font-size:10.5px;color:var(--muted);margin-top:6px;font-weight:600}
.macro .mtgt b.hit{color:var(--good-ink)}
.macro .mtgt b.under{color:var(--accent)}
.macro.on-target{border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.macro.under-target{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}

.meal{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm)}
.meal .mh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.meal .mh b{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.meal .mh span{font-size:11.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.meal .mh span b{color:var(--accent);font-family:"Barlow Condensed",sans-serif;font-weight:800;letter-spacing:.02em}
.meal table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.meal th,.meal td{padding:7px 12px;font-size:12px;text-align:left;color:var(--muted);border-bottom:1px solid var(--line)}
.meal th{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);background:var(--surface-2)}
.meal td.item{color:var(--ink);font-weight:600;font-size:12.5px}
.meal td.qty{color:var(--faint);font-size:11.5px}
.meal td.num,.meal th.num{text-align:right}
.meal tr:last-child td{border-bottom:0}
.meal tr.total td{background:color-mix(in srgb,var(--accent) 6%,transparent);font-weight:700;color:var(--ink);border-top:1px solid var(--line);border-bottom:0}
.meal tr.total td.num{color:var(--accent)}

.daytot{margin-top:14px;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow-sm);display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.daytot .lbl{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:color-mix(in srgb,var(--bg) 60%,var(--accent))}
.daytot .val{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:15px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.daytot .val b{color:var(--accent);font-weight:800}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow-sm)}
.kpi .klab{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.kpi .kval{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:22px;line-height:1;font-variant-numeric:tabular-nums;margin-top:3px;color:var(--ink)}
.kpi .kval.deficit{color:var(--good-ink)}
.kpi .kval.surplus{color:var(--accent)}
.kpi .kval em{font-style:normal;font-size:11px;color:var(--muted);font-weight:600;margin-left:2px}
.kpi .ksub{font-size:11px;color:var(--muted);margin-top:3px;font-weight:500}

.chartcard{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow-sm)}
.chartcard h3{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px;color:var(--ink)}
.chartcard .cwrap{position:relative;height:220px}
.chartcard.small .cwrap{height:190px}

.emptybox{margin-top:14px;background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:22px 16px;text-align:center;font-size:13px;color:var(--muted);line-height:1.55}
.emptybox b{color:var(--ink)}

:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* -------- iOS / mobile UI mode. Every rule is scoped to html[data-mobile] so
   desktop (no attribute) is byte-for-byte unchanged. -------- */
html[data-mobile] body{font-size:17px;overscroll-behavior-y:contain}
html[data-mobile] .shell{max-width:none;height:100dvh;overflow:hidden;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
html[data-mobile] .scroll{-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
html[data-mobile] .wrap{padding:0 10px 24px}

html[data-mobile] .hdr{position:sticky;top:0;padding-top:calc(11px + env(safe-area-inset-top,0px));-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html[data-mobile] .hdr-row{min-height:44px}
html[data-mobile] .dom{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:19}
html[data-mobile] .dom button{min-height:44px;padding:12px 12px;font-size:14px}
html[data-mobile] .iconbtn{width:44px;height:44px;-webkit-tap-highlight-color:transparent}

html[data-mobile] .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding-bottom:env(safe-area-inset-bottom,0px);border-top:1px solid var(--line);background:color-mix(in srgb,var(--surface) 96%,transparent);backdrop-filter:saturate(1.2) blur(10px);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html[data-mobile] .nav button{min-height:56px;padding:8px 0;gap:4px;-webkit-tap-highlight-color:transparent}
html[data-mobile] .nav button svg{width:24px;height:24px}
html[data-mobile] .nav button span{font-size:11px}

html[data-mobile] .chip{min-height:44px;padding:10px 16px;font-size:14.5px;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html[data-mobile] .wkday{min-height:60px;padding:8px 4px;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html[data-mobile] button{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html[data-mobile] input,html[data-mobile] select,html[data-mobile] textarea{font-size:16px}
</style>
</head>

  <header class="hdr">

      <div class="brand">
        <div class="mark">OVER<b>LOAD</b></div>

      <button class="iconbtn" data-action="theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>

</div>
