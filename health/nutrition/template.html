<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Fernando's Nutrition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            min-height: 100vh;
            padding: 24px;
            line-height: 1.6;
            color: #f3f4f6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(31, 41, 55, 0.98);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 2px solid #4b5563;
        }

        h1 {
            color: #f3f4f6;
            margin-bottom: 8px;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .last-updated {
            color: #d1d5db;
            font-size: 14px;
            font-weight: 500;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
            border-bottom: 1px solid #374151;
        }

        .tab {
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            color: #d1d5db;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab:hover { color: #f3f4f6; }
        .tab.active {
            color: #f3f4f6;
            border-bottom-color: #60a5fa;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* --- Cards --- */
        .card {
            background: #2d3748;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        }

        .card h2 {
            color: #f3f4f6;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .card h3 {
            color: #f3f4f6;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .grid { display: grid; gap: 20px; margin-bottom: 24px; }
        .grid-2 { grid-template-columns: 1fr 1fr; }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-4 { grid-template-columns: repeat(4, 1fr); }
        @media (max-width: 800px) {
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
        }

        /* --- Hero In vs Out --- */
        .hero {
            background: linear-gradient(135deg, #1f2937 0%, #0f172a 100%);
            border: 1px solid #374151;
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
        }

        .hero-title {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: #9ca3af;
            margin-bottom: 4px;
        }

        .hero-date {
            font-size: 14px;
            color: #d1d5db;
            margin-bottom: 20px;
        }

        .hero-inout {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 24px;
            margin-bottom: 20px;
        }
        @media (max-width: 640px) {
            .hero-inout { grid-template-columns: 1fr; text-align: center; }
            .hero-inout .sep { display: none; }
        }

        .hero-cell {
            display: flex;
            flex-direction: column;
        }
        .hero-cell.right { text-align: right; align-items: flex-end; }
        @media (max-width: 640px) { .hero-cell.right { text-align: center; align-items: center; } }

        .hero-label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: #9ca3af;
        }

        .hero-value {
            font-size: 56px;
            font-weight: 800;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            margin-top: 6px;
        }
        .hero-value.in  { color: #fbbf24; }
        .hero-value.out { color: #60a5fa; }
        .hero-value em {
            font-style: normal;
            font-size: 16px;
            color: #9ca3af;
            font-weight: 600;
            margin-left: 4px;
        }

        .hero .sep {
            font-size: 32px;
            font-weight: 400;
            color: #4b5563;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            border-radius: 999px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: .01em;
        }
        .badge.deficit {
            background: rgba(16, 185, 129, 0.12);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.35);
        }
        .badge.surplus {
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.35);
        }
        .badge.neutral {
            background: rgba(156, 163, 175, 0.12);
            color: #d1d5db;
            border: 1px solid rgba(209, 213, 219, 0.25);
        }
        .badge-num { font-variant-numeric: tabular-nums; }

        /* --- Macro tiles --- */
        .macros { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        @media (max-width: 800px) { .macros { grid-template-columns: repeat(2, 1fr); } }

        .macro {
            background: #2d3748;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #374151;
        }
        .macro .lbl {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: #9ca3af;
        }
        .macro .val {
            font-size: 32px;
            font-weight: 800;
            color: #f3f4f6;
            font-variant-numeric: tabular-nums;
            margin-top: 4px;
            line-height: 1;
        }
        .macro .val em {
            font-style: normal;
            font-size: 14px;
            color: #9ca3af;
            font-weight: 600;
            margin-left: 4px;
        }
        .macro .pct { font-size: 13px; color: #d1d5db; margin-top: 4px; font-weight: 500; }
        .macro .target { font-size: 12px; color: #9ca3af; margin-top: 8px; font-weight: 500; }
        .macro .target b.under { color: #f87171; }
        .macro .target b.hit   { color: #34d399; }

        .bar {
            margin-top: 12px;
            height: 8px;
            background: #1f2937;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .bar i {
            display: block;
            height: 100%;
            border-radius: 4px;
        }
        .bar i.protein { background: linear-gradient(90deg, #f87171, #ef4444); }
        .bar i.carbs   { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
        .bar i.fat     { background: linear-gradient(90deg, #a78bfa, #8b5cf6); }
        .bar i.fiber   { background: linear-gradient(90deg, #34d399, #10b981); }

        /* --- Diary --- */
        .diary { display: flex; flex-direction: column; gap: 16px; }
        .meal {
            background: #2d3748;
            border-radius: 12px;
            border: 1px solid #374151;
            overflow: hidden;
        }
        .meal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: #374151;
            border-bottom: 1px solid #4b5563;
        }
        .meal-head b {
            font-size: 14px;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: #f3f4f6;
            font-weight: 700;
        }
        .meal-head span {
            font-size: 13px;
            color: #d1d5db;
            font-variant-numeric: tabular-nums;
        }
        .meal-head span b { color: #fbbf24; font-weight: 700; }

        table.items {
            width: 100%;
            border-collapse: collapse;
            font-variant-numeric: tabular-nums;
        }
        table.items th, table.items td {
            padding: 10px 16px;
            text-align: left;
            font-size: 14px;
            color: #d1d5db;
            border-bottom: 1px solid #374151;
        }
        table.items th {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: #9ca3af;
            background: #1f2937;
        }
        table.items td.num, table.items th.num { text-align: right; }
        table.items td.item { color: #f3f4f6; font-weight: 500; }
        table.items td.qty  { color: #9ca3af; font-size: 13px; }
        table.items tr.total td {
            font-weight: 700;
            color: #f3f4f6;
            background: rgba(96, 165, 250, 0.08);
            border-bottom: 0;
        }
        table.items tr.total td.num { color: #fbbf24; }
        table.items tr:last-child td { border-bottom: 0; }

        .day-total {
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 16px 24px;
            background: #1f2937;
            border-radius: 12px;
            border: 1px solid #374151;
        }
        .day-total .lbl {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: #9ca3af;
        }
        .day-total .val {
            font-size: 20px;
            font-weight: 700;
            color: #fbbf24;
            font-variant-numeric: tabular-nums;
        }

        /* --- Trends KPI row --- */
        .kpi {
            background: #2d3748;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #374151;
        }
        .kpi .lbl {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: #9ca3af;
        }
        .kpi .val {
            font-size: 32px;
            font-weight: 800;
            color: #f3f4f6;
            font-variant-numeric: tabular-nums;
            margin-top: 4px;
            line-height: 1;
        }
        .kpi .val em {
            font-style: normal;
            font-size: 14px;
            color: #9ca3af;
            font-weight: 600;
            margin-left: 4px;
        }
        .kpi .val.deficit { color: #34d399; }
        .kpi .val.surplus { color: #f87171; }
        .kpi .sub {
            margin-top: 6px;
            font-size: 13px;
            color: #d1d5db;
        }

        /* --- Chart cards --- */
        .chart-card { background: #2d3748; padding: 24px; border-radius: 12px; border: 1px solid #374151; }
        .chart-card canvas { max-width: 100%; }

        /* --- Empty state --- */
        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #d1d5db;
            font-size: 15px;
            background: #2d3748;
            border-radius: 12px;
            border: 1px dashed #4b5563;
        }
        .empty b { color: #f3f4f6; }

        .disc {
            margin-top: 24px;
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍎 Nutrition</h1>
            <div class="last-updated" id="lastUpdated">Loading…</div>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="today">🍽️ Today</button>
            <button class="tab" data-tab="trends">📈 Trends</button>
        </div>

        <div id="today-tab"  class="tab-content active"></div>
        <div id="trends-tab" class="tab-content"></div>

        <div class="disc">
            View only. Food is logged by chat; this page refreshes daily from Supabase.
            <br>Metric units. Protein target = 2.0 g/kg of latest weight.
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        window.__NUTRITION__ = {
            today:  __TODAY_DATA__,
            trends: __TRENDS_DATA__,
            meta:   __META_DATA__
        };
    </script>
    <script src="./app.js"></script>
</body>
</html>
