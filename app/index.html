<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070d1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Luna" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Luna</title>
    <script>
      // Legacy deep link restore: if an older 404 page stashed the
      // intended path in sessionStorage, put it back before the router
      // loads. Today 404.html is a copy of this page, so deep links
      // load directly and this is a no-op.
      (function () {
        try {
          var target = sessionStorage.getItem('luna:redirect');
          if (target) {
            sessionStorage.removeItem('luna:redirect');
            if (target !== window.location.pathname + window.location.search + window.location.hash) {
              window.history.replaceState(null, '', target);
            }
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
