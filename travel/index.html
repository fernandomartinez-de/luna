<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Trips · Familia Martínez</title>
<meta name="theme-color" content="#FBF8F1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Trips" />
<link rel="apple-touch-icon" href="japan/assets/img/hero-family.jpg" />
<link rel="icon" type="image/jpeg" href="japan/assets/img/hero-family.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;700;900&family=Noto+Sans:wght@300;400;500;600&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root { color-scheme: light; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body {
    background-color: #FBF8F1;
    margin: 0; padding: 0;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  a { -webkit-tap-highlight-color: rgba(199, 71, 44, 0.14); touch-action: manipulation; }
  body {
    color: #1B1815;
    font-family: 'Noto Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background-image:
      radial-gradient(rgba(27,24,21,0.025) 1px, transparent 1px),
      radial-gradient(rgba(27,24,21,0.02) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1px 2px;
  }
  .wrap { max-width: 720px; padding: 40px 24px; }
  .display { font-family: 'Noto Serif JP', Georgia, serif; font-weight: 500; letter-spacing: -0.01em; }
  .kanji { font-family: 'Noto Serif JP', serif; font-weight: 900; color: rgba(199, 71, 44, 0.14); font-size: 180px; line-height: 1; position: absolute; top: 20px; left: -10px; pointer-events: none; user-select: none; }
  .eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #6E655A; }
  h1 { font-size: clamp(48px, 8vw, 96px); line-height: 1; margin: 20px 0 12px; }
  .lede { color: #3C352E; max-width: 52ch; line-height: 1.6; margin-bottom: 32px; }
  .trip {
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px; padding: 20px 24px;
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(27,24,21,0.14);
    border-radius: 6px;
    text-decoration: none; color: inherit;
    transition: border-color 200ms, transform 200ms;
  }
  .trip:hover { border-color: #C7472C; transform: translateY(-2px); }
  .trip .name { display: block; font-family: 'Noto Serif JP', serif; font-size: 24px; }
  .trip .meta { display: block; font-size: 13px; color: #6E655A; margin-top: 4px; }
  .trip .arrow { color: #C7472C; font-size: 20px; }
  .foot { margin-top: 40px; font-size: 12px; color: #8C8377; }
  .accent { background-image: linear-gradient(transparent 62%, rgba(199, 71, 44, 0.22) 62%, rgba(199, 71, 44, 0.22) 92%, transparent 92%); padding-inline: 0.1em; }
</style>
</head>
<body>
<div class="wrap" style="position: relative;">
  <div class="kanji">旅</div>
  <p class="eyebrow">Familia Martínez</p>
  <h1 class="display">Nuestros <span class="accent">viajes</span>.</h1>
  <p class="lede">Un cuaderno vivo por cada viaje. Fechas, itinerario, mapa, presupuesto y las fotos que traemos en la cabeza. Elige un viaje abajo.</p>

  <a class="trip" href="./japan/">
    <div>
      <span class="name">Japón</span>
      <span class="meta">14 al 29 de noviembre, 2026 · 16 días · Tokio, Mt. Fuji, Kioto, Nara, Osaka</span>
    </div>
    <span class="arrow">→</span>
  </a>

  <p class="foot">Hecho con cariño. Hosted en GitHub Pages.</p>
</div>
</body>
</html>
