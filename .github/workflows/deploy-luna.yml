name: Deploy Luna

# Builds the React app in app/ and publishes it to GitHub Pages at
# https://fernandomartinez-de.github.io/luna/
# Only the built app is published; nothing else in the repo is served.
# Requires Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy-luna.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_KEY }}
          VITE_FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          VITE_RAPIDAPI_KEY: ${{ secrets.ZILLOW_API_KEY }}
        run: npm run build

      - name: Single page app fallback
        # GitHub Pages serves 404.html for unknown paths; making it a copy of
        # the app lets links deep inside the app (e.g. /luna/finances) load.
        run: cp app/dist/index.html app/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
