name: Whoop Sync

on:
  schedule:
    # 5x/day at 9am/12pm/3pm/6pm/10pm ET (EDT).
    # In winter (EST) these shift 1 hour earlier ET — cron is fixed UTC.
    - cron: '0 2,13,16,19,22 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests supabase PyNaCl

      - name: Test Supabase DNS and connectivity
        run: |
          echo "Testing DNS resolution..."
          nslookup uuvswtpcexhqojlrsrv.supabase.co || echo "DNS lookup failed"
          echo "Testing HTTPS connectivity..."
          curl -v https://uuvswtpcexhqojlrsrv.supabase.co/rest/v1/ -H "apikey: ${{ secrets.SUPABASE_KEY }}" || echo "Connection failed"

      - name: Sync Whoop data
        env:
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          WHOOP_REFRESH_TOKEN: ${{ secrets.WHOOP_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cd health/whoop
          python sync.py
