name: Medical - Process Inbox

# Drop new medical documents into Google Drive Medical/IN, then run this.
# Each file is read, renamed YYYY-MM-DD_category_provider_type.ext and moved
# to Medical/{year}/{category}/, or to Medical/_REVISAR if it can't be placed
# confidently. Filed lab PDFs and InBody images are loaded into Supabase, and
# Medical/master_tracker.xlsx is rebuilt as a full inventory.
# Code: health/medical/medical_inbox.py

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (change nothing in Drive or Supabase)"
        type: boolean
        default: false
      reload:
        description: "Re-read these archived lab files and replace their results (comma separated file names, optional)"
        type: string
        default: ""
  schedule:
    - cron: "17 12 * * *"   # daily ~8 AM New York; cheap when IN is empty

permissions:
  contents: read

concurrency:
  group: medical-inbox
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: health/medical
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install -q -r requirements.txt

      - name: Process Medical/IN
        env:
          GDRIVE_CREDENTIALS:        ${{ secrets.GOOGLE_CREDENTIALS }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:              ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RELOAD:                    ${{ inputs.reload }}
        run: python medical_inbox.py ${{ inputs.dry_run && '--dry-run' || '' }} --reload "$RELOAD"
