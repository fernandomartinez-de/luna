name: Medical - Rebuild lab results (staging)

# One-off maintenance: re-extracts every lab PDF in Drive Medical into the
# lab_results_rebuild staging table. Never writes to lab_results itself.
# Code: health/medical/rebuild_labs.py

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Only files whose name contains this (blank = all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: health/medical
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install -q -r requirements.txt
      - name: Re-extract lab PDFs into staging
        env:
          GDRIVE_CREDENTIALS:        ${{ secrets.GOOGLE_CREDENTIALS }}
          ANTHROPIC_API_KEY:         ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:              ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ONLY:                      ${{ inputs.only }}
        run: python rebuild_labs.py ${ONLY:+--only "$ONLY"}
